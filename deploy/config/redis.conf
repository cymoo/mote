# Redis for Mote. Runs as a systemd --user service owned by the deploy user,
# so it needs no root and no Docker.
#
# Mote keeps only derived state here: the full-text inverted index (rebuildable
# from SQLite via the "rebuild-fulltext-index" task at /tasks/) and share-link
# rate-limit counters. Losing it costs a reindex, not data.

bind 127.0.0.1 -::1
port 6379
protected-mode yes

daemonize no
supervised systemd

dir __APP_DIR__/redis
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
appendonly no

# The index must never be silently evicted — that would corrupt search results
# without any error surfacing.
maxmemory-policy noeviction

loglevel notice
logfile ""
